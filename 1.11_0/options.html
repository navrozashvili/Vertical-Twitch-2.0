<!DOCTYPE html>
<html>
  <head>
    <title>Vertical Twitch Options</title>
  </head>
  <body>
    <select id="orientation">
      <option value="horizontal">Always start horizontal mode</option>
      <option value="vertical">Always start vertical mode</option>
      <option value="vertical_theatre">Always start vertical theatre mode</option>
      <option value="previous">Resume from previous viewing state</option>
    </select>
    <div id="status"></div>
    <button id="save">Save</button>

    <script src="options.js"></script>
  </body>
</html>
